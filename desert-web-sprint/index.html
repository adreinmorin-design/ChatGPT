<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Desert Web Sprint — Concept Preview</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e8;color:#171813}
    .card{width:min(560px,calc(100% - 30px));border:1px solid #d8d1c4;border-radius:22px;background:#fffdf8;padding:32px;box-shadow:0 18px 55px #00000014}
    .k{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#7a674e}.title{font:400 38px/1.02 Georgia,serif;margin:12px 0}
    .msg{font-size:14px;line-height:1.65;color:#676963}.err{color:#8a322b}.spinner{width:26px;height:26px;border-radius:50%;border:3px solid #ddd4c5;border-top-color:#171813;animation:s .8s linear infinite;margin-top:20px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="k">Desert Web Sprint</div>
    <div class="title">Loading your website concept…</div>
    <div id="msg" class="msg">Fetching the latest private concept preview.</div>
    <div id="spin" class="spinner" aria-hidden="true"></div>
  </main>
<script>
(async function(){
  const msg=document.getElementById("msg"),spin=document.getElementById("spin");
  const q=new URLSearchParams(location.search);
  const slug=(q.get("slug")||"").toLowerCase();
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)){
    msg.textContent="This concept link is invalid.";msg.classList.add("err");spin.remove();return;
  }
  const api="https://sspntpbnpsdmldqotjqp.supabase.co/functions/v1/concept?slug="+encodeURIComponent(slug)+"&format=json";
  try{
    const r=await fetch(api,{headers:{"accept":"application/json"}});
    if(!r.ok)throw new Error("Concept unavailable ("+r.status+")");
    const data=await r.json();
    if(!data||!data.ok||typeof data.html!=="string")throw new Error("Invalid concept response");
    document.open();
    document.write(data.html);
    document.close();
  }catch(e){
    msg.textContent="The concept could not be loaded. Please reply to the email or call/text 951-292-0987.";
    msg.classList.add("err");spin.remove();
    console.error(e);
  }
})();
</script>
</body>
</html>
